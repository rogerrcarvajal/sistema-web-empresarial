<style>
/**
 * ============================================================================
 * Proyecto: Sistema Web Empresarial — Módulo de Autenticación, Usuarios y RBAC
 * Autor: Rogerr Carvajal <rogerrcarvajal@gmail.com>
 * Rol: Desarrollador de Soluciones con Modelos & Agentes Inteligentes
 * Repositorio: https://github.com/rogerrcarvajal/sistema-web-empresarial
 * Estándar: Quantum Dark Mode / Glassmorphism / Responsive Design System
 * ============================================================================
 */

:root {
  /* Surface & Backgrounds */
  --bg-dark-primary: #0b0f19;
  --bg-dark-surface: #111827;
  --bg-dark-card: #1e293b;
  --bg-glass: rgba(30, 41, 59, 0.72);
  --bg-glass-hover: rgba(51, 65, 85, 0.85);
  --bg-glass-deep: rgba(15, 23, 42, 0.85);

  /* Brand Accents & Gradients */
  --accent-cyan: #38bdf8;
  --accent-indigo: #6366f1;
  --accent-purple: #8b5cf6;
  --gradient-brand: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #8b5cf6 100%);
  --gradient-card-glow: radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 70%);

  /* Typography Colors */
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-accent: #38bdf8;

  /* Borders & Glass Dividers */
  --border-glass: rgba(255, 255, 255, 0.1);
  --border-active: rgba(56, 189, 248, 0.45);

  /* Status Colors */
  --status-success: #10b981;
  --status-warning: #f59e0b;
  --status-error: #ef4444;
  --status-info: #3b82f6;

  /* Shadows & Effects */
  --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.42);
  --blur-glass: blur(14px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', 'Outfit', system-ui, -apple-system, sans-serif;
  background-color: var(--bg-dark-primary);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(56, 189, 248, 0.12) 0%, transparent 38%),
    radial-gradient(circle at 88% 82%, rgba(99, 102, 241, 0.14) 0%, transparent 42%);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ============================================================================
   1. UTILIDADES GLASSMORPHIC Y BOTONES
   ============================================================================ */
.card-glass {
  background: var(--bg-glass);
  background-image: var(--gradient-card-glow);
  backdrop-filter: var(--blur-glass);
  -webkit-backdrop-filter: var(--blur-glass);
  border: 1px solid var(--border-glass);
  border-radius: 16px;
  padding: 1.5rem;
  box-shadow: var(--shadow-glass);
  transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}

.card-glass:hover {
  border-color: var(--border-active);
  box-shadow: 0 12px 40px 0 rgba(56, 189, 248, 0.12);
}

.btn {
  font-family: inherit;
  font-size: 0.925rem;
  font-weight: 600;
  border-radius: 10px;
  padding: 0.72rem 1.25rem;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  text-decoration: none;
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--gradient-brand);
  color: #ffffff;
  box-shadow: 0 4px 16px rgba(99, 102, 241, 0.32);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(56, 189, 248, 0.42);
}

.btn-secondary {
  background: rgba(30, 41, 59, 0.85);
  color: var(--text-primary);
  border-color: var(--border-glass);
}

.btn-secondary:hover:not(:disabled) {
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
}

.btn-danger {
  background: rgba(239, 68, 68, 0.16);
  color: #fca5a5;
  border-color: rgba(239, 68, 68, 0.35);
}

.btn-danger:hover:not(:disabled) {
  background: rgba(239, 68, 68, 0.28);
}

.btn-block {
  width: 100%;
}

/* ============================================================================
   2. CONTENEDOR DE AUTENTICACIÓN (LOGIN / REGISTRO / RECUPERACIÓN)
   ============================================================================ */
.auth-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}

.auth-shell {
  width: 100%;
  max-width: 980px;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  border-radius: 22px;
  overflow: hidden;
  border: 1px solid var(--border-glass);
  background: var(--bg-glass-deep);
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
}

.auth-hero {
  padding: 2.75rem;
  background:
    linear-gradient(155deg, rgba(15, 23, 42, 0.92), rgba(30, 41, 59, 0.85)),
    radial-gradient(circle at top right, rgba(56, 189, 248, 0.25), transparent 60%);
  border-right: 1px solid var(--border-glass);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.38rem 0.85rem;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: rgba(56, 189, 248, 0.14);
  color: var(--accent-cyan);
  border: 1px solid rgba(56, 189, 248, 0.35);
  width: fit-content;
}

.auth-hero h1 {
  font-size: 2rem;
  font-weight: 700;
  line-height: 1.2;
  margin-top: 1.25rem;
  letter-spacing: -0.025em;
}

.auth-hero p {
  color: var(--text-secondary);
  margin-top: 0.85rem;
  font-size: 0.95rem;
}

.feature-pills {
  margin-top: 1.75rem;
  display: grid;
  gap: 0.75rem;
}

.feature-pill {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  border-radius: 12px;
  background: rgba(15, 23, 42, 0.65);
  border: 1px solid var(--border-glass);
  font-size: 0.86rem;
  color: var(--text-primary);
}

.feature-pill span.icon {
  color: var(--accent-cyan);
  font-weight: 700;
}

.auth-form-panel {
  padding: 2.75rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.auth-tabs {
  display: flex;
  gap: 0.5rem;
  background: rgba(15, 23, 42, 0.75);
  padding: 0.35rem;
  border-radius: 12px;
  border: 1px solid var(--border-glass);
  margin-bottom: 1.5rem;
}

.auth-tab {
  flex: 1;
  text-align: center;
  padding: 0.55rem 0.75rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  border-radius: 8px;
  cursor: pointer;
  border: none;
  background: transparent;
  transition: all 0.2s ease;
}

.auth-tab.active {
  background: var(--gradient-brand);
  color: #ffffff;
}

/* ============================================================================
   3. FORMULARIOS Y CONTROLES DE ENTRADA
   ============================================================================ */
.form-group {
  margin-bottom: 1.15rem;
}

.form-label {
  display: block;
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 0.42rem;
}

.form-control {
  width: 100%;
  padding: 0.75rem 0.95rem;
  border-radius: 10px;
  border: 1px solid var(--border-glass);
  background: rgba(15, 23, 42, 0.82);
  color: var(--text-primary);
  font-size: 0.92rem;
  font-family: inherit;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.form-control:focus {
  outline: none;
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
}

.form-helper {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 0.3rem;
}

/* ============================================================================
   4. LAYOUT DEL SISTEMA EMPRESARIAL (SIDEBAR + TOPBAR + VISTAS)
   ============================================================================ */
.app-layout {
  display: grid;
  grid-template-columns: 270px 1fr;
  min-height: 100vh;
}

.sidebar {
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: var(--blur-glass);
  border-right: 1px solid var(--border-glass);
  padding: 1.5rem 1.15rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.sidebar-brand {
  padding: 0.5rem 0.65rem 1.25rem;
  border-bottom: 1px solid var(--border-glass);
}

.sidebar-brand h2 {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

.sidebar-brand small {
  color: var(--accent-cyan);
  font-size: 0.75rem;
  font-weight: 600;
}

.nav-section-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin: 1.15rem 0.65rem 0.45rem;
  font-weight: 700;
}

.nav-list {
  list-style: none;
  display: grid;
  gap: 0.3rem;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.68rem 0.85rem;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s ease;
}

.nav-item:hover {
  background: rgba(30, 41, 59, 0.65);
  color: var(--text-primary);
}

.nav-item.active {
  background: rgba(56, 189, 248, 0.14);
  color: var(--accent-cyan);
  border-color: rgba(56, 189, 248, 0.35);
  font-weight: 600;
}

.main-area {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  height: 70px;
  padding: 0 2rem;
  border-bottom: 1px solid var(--border-glass);
  background: rgba(15, 23, 42, 0.72);
  backdrop-filter: var(--blur-glass);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.user-pill {
  display: flex;
  align-items: center;
  gap: 0.85rem;
}

.avatar-circle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--gradient-brand);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.95rem;
  color: #fff;
}

.content-container {
  padding: 2rem;
  max-width: 1360px;
  width: 100%;
  margin: 0 auto;
}

/* ============================================================================
   5. MÉTRICAS, TABLAS Y BADGES DE ESTADO / ROLES
   ============================================================================ */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 1.15rem;
  margin-bottom: 1.75rem;
}

.metric-card .metric-value {
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-top: 0.25rem;
}

.metric-card .metric-label {
  font-size: 0.82rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

.data-table th,
.data-table td {
  padding: 0.85rem 1rem;
  text-align: left;
  border-bottom: 1px solid var(--border-glass);
}

.data-table th {
  color: var(--text-secondary);
  font-weight: 600;
  text-transform: uppercase;
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  background: rgba(15, 23, 42, 0.55);
}

.data-table tr:hover td {
  background: rgba(56, 189, 248, 0.04);
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 0.24rem 0.65rem;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 600;
}

.badge-success {
  background: rgba(16, 185, 129, 0.16);
  color: #34d399;
  border: 1px solid rgba(16, 185, 129, 0.35);
}

.badge-danger {
  background: rgba(239, 68, 68, 0.16);
  color: #f87171;
  border: 1px solid rgba(239, 68, 68, 0.35);
}

.badge-info {
  background: rgba(56, 189, 248, 0.15);
  color: var(--accent-cyan);
  border: 1px solid rgba(56, 189, 248, 0.35);
}

/* ============================================================================
   6. ALERTAS, TOASTS Y RESPONSIVE
   ============================================================================ */
.toast-container {
  position: fixed;
  top: 1.25rem;
  right: 1.25rem;
  z-index: 9999;
  display: grid;
  gap: 0.65rem;
  max-width: 380px;
}

.toast {
  padding: 0.9rem 1.15rem;
  border-radius: 12px;
  background: rgba(15, 23, 42, 0.95);
  border-left: 4px solid var(--accent-cyan);
  box-shadow: var(--shadow-glass);
  color: var(--text-primary);
  font-size: 0.88rem;
  animation: slideIn 0.22s ease-out;
}

.toast.error {
  border-left-color: var(--status-error);
}

.toast.success {
  border-left-color: var(--status-success);
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.hidden {
  display: none !important;
}

.permissions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 0.75rem;
  margin-top: 1rem;
}

.perm-checkbox-card {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  padding: 0.75rem;
  border-radius: 10px;
  background: rgba(15, 23, 42, 0.65);
  border: 1px solid var(--border-glass);
  cursor: pointer;
}

@media (max-width: 900px) {
  .auth-shell {
    grid-template-columns: 1fr;
  }
  .auth-hero {
    border-right: none;
    border-bottom: 1px solid var(--border-glass);
    padding: 1.75rem;
  }
  .auth-form-panel {
    padding: 1.75rem;
  }
  .app-layout {
    grid-template-columns: 1fr;
  }
  .sidebar {
    border-right: none;
    border-bottom: 1px solid var(--border-glass);
  }
}
</style>
